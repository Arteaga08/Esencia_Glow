name: CI

on:
  pull_request:
  push:
    branches: [main]

# Railway espera a que este workflow termine en verde antes de desplegar
# (ver README §"Runbook de deploy") — sin permisos de escritura, este
# workflow solo lee el repo.
permissions:
  contents: read

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # pnpm ANTES que setup-node: setup-node necesita el binario de pnpm ya
      # instalado para poder cachear su store (cache: "pnpm" de abajo).
      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: ".nvmrc"
          cache: "pnpm"

      # mongodb-memory-server descarga un binario real de mongod la primera
      # vez que corre (no viene en el paquete de npm) — cada uno de los 146
      # archivos de test levanta su propio MongoMemoryReplSet, así que sin
      # esta caché cada corrida de CI lo volvería a descargar. El binario
      # cae por default en ~/.cache/mongodb-binaries (mongodb-memory-server-core,
      # independiente de dónde pnpm guarde node_modules).
      - name: Cachear binario de mongodb-memory-server
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/mongodb-binaries
          key: mongodb-binaries-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile

      - name: Verificar (typecheck + lint + build + test)
        run: pnpm verify

      - name: Auditoría de dependencias de producción
        run: pnpm audit --prod --audit-level high
